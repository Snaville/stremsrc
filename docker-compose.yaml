services:
  # Tailscale sidecar (userspace) — joins the tailnet, routes outbound through the
  # home exit node, and exposes a local SOCKS5 proxy on :1055. Only stremsrc uses it,
  # so only the scraping traffic exits via the home residential IP.
  ts:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: stremsrc-coolify
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_USERSPACE=true
      - TS_SOCKS5_SERVER=:1055
      - TS_EXTRA_ARGS=--exit-node=${TS_EXIT_NODE} --exit-node-allow-lan-access
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tsdata:/var/lib/tailscale

  stremsrc:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "56245"
    environment:
      - PORT=56245
      - SOCKS_PROXY=socks5://ts:1055
    depends_on:
      - ts

volumes:
  tsdata:
